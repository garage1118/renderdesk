<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Base Color Gradients -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0F0" />
      <stop offset="100%" stop-color="#2185C5" />
    </linearGradient>

    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2185C5" />
      <stop offset="100%" stop-color="#4B51A1" />
    </linearGradient>

    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B7BB9" />
      <stop offset="100%" stop-color="#55479E" />
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>

    <!-- Subtle Glow Filter for U+2728 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Isometric Cube Faces -->
    <!-- Top Face -->
    <polygon points="250,90 410,182 250,274 90,182" fill="url(#topGrad)" />

    <!-- Left Face -->
    <polygon points="82,196 242,288 242,472 82,380" fill="url(#leftGrad)" />

    <!-- Right Face -->
    <polygon points="258,288 418,196 418,380 258,472" fill="url(#rightGrad)" />

    <!-- U+2728 Sparkles mapped to Isometric Perspective Matrix -->
    <g transform="translate(250, 182) matrix(0.866025, 0.5, -0.866025, 0.5, 0, 0)" filter="url(#glow)">
      <!-- Main Four-Point Star -->
      <path d="M 0,-42 Q 0,-6 36,-6 Q 0,-6 0,30 Q 0,-6 -36,-6 Q 0,-6 0,-42 Z" fill="url(#sparkleGrad)" />
      
      <!-- Secondary Smaller Four-Point Star (U+2728 Layout) -->
      <path d="M 28,-36 Q 28,-18 46,-18 Q 28,-18 28,0 Q 28,-18 10,-18 Q 28,-18 28,-36 Z" fill="url(#sparkleGrad)" />
      
      <!-- Tiny Accent Star -->
      <path d="M -22,12 Q -22,20 -14,20 Q -22,20 -22,28 Q -22,20 -30,20 Q -22,20 -22,12 Z" fill="url(#sparkleGrad)" opacity="0.9" />
    </g>
  </g>
</svg>
