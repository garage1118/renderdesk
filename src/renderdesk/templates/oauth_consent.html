<!doctype html>
<html lang="en">
<title>renderdesk — authorize {{ client_name }}</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/theme.js"></script>
<div class="auth-shell">
  <a href="/" class="brand" style="font-size:1.15rem"><img src="/static/logo.svg" class="brand-mark" alt="">renderdesk</a>
  <div class="card auth-card">
    <h1>Authorize {{ client_name }}</h1>
    <p class="auth-sub">Signed in as {{ user.email }}. This will let <strong>{{ client_name }}</strong> access renderdesk on your
      behalf{% if scope %} (scope: {{ scope }}){% endif %}.</p>
    <form method="post" action="/oauth/consent">
      <input type="hidden" name="request_id" value="{{ request_id }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <div class="field-row" style="margin-top:0.5rem">
        <button type="submit" name="action" value="deny" class="btn btn-block">Deny</button>
        <button type="submit" name="action" value="approve" class="btn btn-primary btn-block">Approve</button>
      </div>
    </form>
  </div>
</div>
</html>
