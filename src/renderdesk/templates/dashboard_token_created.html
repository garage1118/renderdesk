<!doctype html>
<html lang="en">
<title>renderdesk — new token</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/theme.js"></script>
{% set active_nav = "connections" %}
{% include "_topbar.html" %}
<main class="page page-narrow">
  <h1 class="page-title" style="margin-bottom:0.75rem">Token created</h1>
  <div class="alert alert-warn">Copy this now — it will not be shown again.</div>
  <div class="token-box">
    <span id="token" style="flex:1">{{ token }}</span>
    <button type="button" class="btn btn-primary btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('token').textContent)">Copy</button>
  </div>
  <p class="breadcrumb" style="margin-top:1.5rem"><a href="/dashboard/connections">&larr; Back to connections</a></p>
</main>
</html>
