<!doctype html>
<title>renderdesk — log in</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
  form { background: #1e293b; padding: 2rem; border-radius: 12px; display: flex; flex-direction: column; gap: 0.75rem; width: 280px; }
  input { padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
  button { padding: 0.5rem; border-radius: 6px; border: none; background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; }
  .error { color: #f87171; font-size: 0.9rem; }
</style>
<form method="post" action="/dashboard/login">
  <h1 style="margin:0 0 0.5rem;font-size:1.1rem;">renderdesk</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <input type="email" name="email" placeholder="Email" required autofocus>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Log in</button>
</form>
