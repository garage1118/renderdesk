<!doctype html>
<html lang="en">
<title>renderdesk — log in</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/theme.js"></script>
<div class="auth-shell">
  <a href="/" class="brand" style="font-size:1.15rem"><img src="/static/logo.svg" class="brand-mark" alt="">renderdesk</a>
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  {% if scheme == "password" %}
  <form method="post" action="/dashboard/login" class="card auth-card">
    <h1>Log in</h1>
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <input type="email" name="email" placeholder="Email" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  {% elif scheme == "oidc" %}
  <div class="card auth-card">
    <h1>Log in</h1>
    <a class="btn btn-primary" href="/dashboard/auth/oidc/login?next={{ next | urlencode }}">Sign in with SSO</a>
  </div>
  {% endif %}
</div>
</html>
