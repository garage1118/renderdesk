[project]
name = "renderdesk"
version = "1.2.2"
description = "Self-hosted MCP artifact store"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "mcp>=1.28",
    "aiosqlite>=0.20",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
    "click>=8.1",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "jinja2>=3.1",
    "pygments>=2.18",
    "mdit-py-plugins>=0.4",
    "authlib>=1.3,<2",
    "httpx>=0.27",
]

[project.scripts]
renderdesk = "renderdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renderdesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.21",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Form() as a parameter default is the framework's
# own required idiom, not the bug pattern bugbear is built to catch.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest.py deliberately sets env vars before importing anything that
# constructs Settings at import time (see its own comment) — reordering
# these imports to satisfy E402 would break that.
"tests/conftest.py" = ["E402"]
# Alembic's own generated boilerplate (revision/down_revision typing) —
# left exactly as generated rather than hand-edited for style.
"migrations/versions/*.py" = ["UP007", "UP035"]
