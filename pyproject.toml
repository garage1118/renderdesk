[project]
name = "renderdesk"
version = "0.1.0"
description = "Self-hosted MCP artifact store"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "mcp>=1.28",
    "aiosqlite>=0.20",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
    "click>=8.1",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "jinja2>=3.1",
    "pygments>=2.18",
    "mdit-py-plugins>=0.4",
]

[project.scripts]
renderdesk = "renderdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renderdesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]
