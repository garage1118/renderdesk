name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check .

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # :edge always moves to the newest tagged release, RC or not —
          # it's the homelab/testbed tracking tag.
          TAGS="garage1118/renderdesk:${VERSION}
          garage1118/renderdesk:edge"
          # A tag with no "-" suffix (e.g. v1.0.0, not v1.0.0-rc1) is a
          # final release — only those move the :latest tag, so an RC or
          # other prerelease never clobbers what :latest points at.
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS}
          garage1118/renderdesk:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
