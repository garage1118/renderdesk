name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

# Least privilege by default — the docker job below needs write access to
# Docker Hub only (a separate credential, not a GITHUB_TOKEN permission),
# so nothing in this workflow needs more than read access to the repo
# itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check .

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine image tags
        id: meta
        run: |
          # A manual (workflow_dispatch) run has no version tag to derive
          # VERSION/latest from — it only ever produces :edge, for pulling
          # a build ahead of cutting a real release tag.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAGS="garage1118/renderdesk:edge"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            # :edge always moves to the newest tagged release, RC or not —
            # it's the homelab/testbed tracking tag.
            TAGS="garage1118/renderdesk:${VERSION}
          garage1118/renderdesk:edge"
            # A tag with no "-" suffix (e.g. v1.0.0, not v1.0.0-rc1) is a
            # final release — only those move the :latest tag, so an RC or
            # other prerelease never clobbers what :latest points at.
            if [[ "${VERSION}" != *-* ]]; then
              TAGS="${TAGS}
          garage1118/renderdesk:latest"
            fi
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
